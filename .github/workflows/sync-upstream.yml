name: Sync upstream develop

on:
  schedule:
    - cron: '0 3 * * *'   # 3 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read

# GITHUB_TOKEN cannot update .github/workflows/** in any form — git push,
# merge-upstream, and even a refs-API force-move are all rejected (the
# `workflows` scope does not exist for Actions tokens). Upstream regularly
# touches its workflows (dependabot actions bumps), so sync must push with
# a credential exempt from scope checks: a write deploy key.
#
# One-time setup (repo admin):
#   ssh-keygen -t ed25519 -N '' -C sync-upstream -f sync_key
#   gh repo deploy-key add sync_key.pub --allow-write --title sync-upstream --repo ledoent/platform
#   gh secret set SYNC_SSH_KEY --repo ledoent/platform < sync_key && rm sync_key sync_key.pub
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_SSH_KEY }}

      - name: Force-reset develop to upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/hcengineering/platform.git
          git fetch upstream develop
          UPSTREAM=$(git rev-parse upstream/develop)
          LOCAL=$(git rev-parse HEAD)
          if [ "$UPSTREAM" = "$LOCAL" ]; then
            echo "Already in sync ($UPSTREAM)."
          else
            echo "Resetting develop: $LOCAL -> $UPSTREAM"
            git reset --hard upstream/develop
            git push --force-with-lease origin develop
          fi
