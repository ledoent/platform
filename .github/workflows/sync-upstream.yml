name: Sync upstream develop

on:
  schedule:
    - cron: '0 3 * * *'   # 3 AM UTC daily
  workflow_dispatch:

permissions:
  contents: write

# GITHUB_TOKEN cannot `git push` commits that touch .github/workflows/**
# (needs the unavailable `workflows` scope), so sync server-side instead:
# merge-upstream fast-forwards; if upstream rewrote history, force-move the
# ref to the upstream SHA (objects already exist in the fork network).
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Sync develop from upstream
        run: |
          set -euo pipefail
          UPSTREAM=$(gh api repos/hcengineering/platform/git/ref/heads/develop --jq .object.sha)
          LOCAL=$(gh api repos/${{ github.repository }}/git/ref/heads/develop --jq .object.sha)
          if [ "$UPSTREAM" = "$LOCAL" ]; then
            echo "Already in sync ($UPSTREAM)."
            exit 0
          fi
          echo "Syncing develop: $LOCAL -> $UPSTREAM"
          if gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=develop; then
            echo "Fast-forwarded via merge-upstream."
          else
            echo "merge-upstream failed (non-FF?); force-updating ref."
            gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/develop \
              -f sha="$UPSTREAM" -F force=true
          fi
