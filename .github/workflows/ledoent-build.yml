name: ledoent build (Huly images → Zot)

# Builds linux/amd64 images for all Huly services from the build/deploy
# branch and pushes to registry.hz.ledoweb.com/huly/.
# Triggered by gitaggregate pushing the merged feature branch.
# ZOT_CI_PASSWORD secret must be set in repo settings (github-ci credentials).

on:
  push:
    branches: [build/deploy]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. v0.7.413-token-r4). Defaults to version.txt + git SHA.'
        required: false

concurrency:
  group: ledoent-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOT_REGISTRY: registry.hz.ledoweb.com
  ZOT_IMAGE_PREFIX: registry.hz.ledoweb.com/huly
  # Opt JS-based actions onto Node 24 ahead of the June 2026 forced bump.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Rush build + push all service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Rush dependencies
        uses: actions/cache@v4
        with:
          path: common/temp
          key: rush-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          restore-keys: rush-

      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      - name: Rush build
        run: node common/scripts/install-run-rush.js build -v

      - name: Rush bundle
        run: node common/scripts/install-run-rush.js bundle -v

      - name: Rush package
        # Runs the `package` phase across the repo. Critical for `dev/prod`
        # (webpack-builds the SPA into dev/prod/dist) and `pods/front`
        # (copies dev/prod/dist → pods/front/dist for the Docker context).
        # Without this the front Dockerfile's `COPY dist/ ./dist/` fails.
        run: node common/scripts/install-run-rush.js package -v

      - name: Compute version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(tr -d '"[:space:]' < common/scripts/version.txt)
            SHA=$(git rev-parse --short HEAD)
            echo "tag=v${BASE}-r${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Zot registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ZOT_REGISTRY }}
          username: github-ci
          password: ${{ secrets.ZOT_CI_PASSWORD }}

      # -- Node.js services (require pre-built artifacts from rush bundle) --

      - name: Build and push account
        uses: docker/build-push-action@v6
        with:
          context: pods/account
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/account:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=account
          cache-to: type=gha,scope=account,mode=max

      - name: Build and push collaborator
        uses: docker/build-push-action@v6
        with:
          context: pods/collaborator
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/collaborator:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=collaborator
          cache-to: type=gha,scope=collaborator,mode=max

      - name: Build and push front
        uses: docker/build-push-action@v6
        with:
          context: pods/front
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/front:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

      - name: Build and push fulltext
        uses: docker/build-push-action@v6
        with:
          context: pods/fulltext
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/fulltext:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=fulltext
          cache-to: type=gha,scope=fulltext,mode=max

      - name: Build and push stats
        uses: docker/build-push-action@v6
        with:
          context: pods/stats
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/stats:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=stats
          cache-to: type=gha,scope=stats,mode=max

      - name: Build and push transactor
        uses: docker/build-push-action@v6
        with:
          context: pods/server
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/transactor:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=transactor
          cache-to: type=gha,scope=transactor,mode=max

      - name: Build and push workspace
        uses: docker/build-push-action@v6
        with:
          context: pods/workspace
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/workspace:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max

      - name: Build and push ai-bot
        uses: docker/build-push-action@v6
        with:
          context: services/ai-bot/pod-ai-bot
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/ai-bot:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=ai-bot
          cache-to: type=gha,scope=ai-bot,mode=max

      - name: Build and push github
        uses: docker/build-push-action@v6
        with:
          context: services/github/pod-github
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/github:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=github
          cache-to: type=gha,scope=github,mode=max

      - name: Build and push rekoni-service
        uses: docker/build-push-action@v6
        with:
          context: services/rekoni
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/rekoni-service:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=rekoni
          cache-to: type=gha,scope=rekoni,mode=max

      # -- Rust service (self-contained, does not need rush) --

      - name: Build and push hulykvs (hulylake)
        uses: docker/build-push-action@v6
        with:
          context: foundations/hulylake
          platforms: linux/amd64
          push: true
          tags: ${{ env.ZOT_IMAGE_PREFIX }}/hulykvs:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=hulykvs
          cache-to: type=gha,scope=hulykvs,mode=max

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          {
            echo "### Images pushed to Zot"
            echo ''
            echo "**Version:** \`$VERSION\`"
            echo ''
            echo '| Service | Image |'
            echo '|---|---|'
            for SVC in account collaborator front fulltext stats transactor workspace ai-bot github rekoni-service hulykvs; do
              echo "| $SVC | \`${{ env.ZOT_IMAGE_PREFIX }}/$SVC:$VERSION\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"