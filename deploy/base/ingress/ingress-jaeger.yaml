apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: huly-jaeger
  labels:
    app.kubernetes.io/part-of: huly
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # OAuth2 proxy auth — only @ledoweb.com Google accounts
    nginx.ingress.kubernetes.io/auth-url: "https://huly.hz.ledoweb.com/_oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://huly.hz.ledoweb.com/_oauth2/start?rd=$escaped_request_uri"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - huly.hz.ledoweb.com
      secretName: huly-tls
  rules:
    - host: huly.hz.ledoweb.com
      http:
        paths:
          - path: /_jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
