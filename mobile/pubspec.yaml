name: huly_mobile
description: Huly mobile client for iOS
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  go_router: ^14.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  receive_sharing_intent: ^1.8.0
  uuid: ^4.3.0
  flutter_web_auth_2: ^4.0.0
  image_picker: ^1.0.0
  local_auth: ^2.1.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
